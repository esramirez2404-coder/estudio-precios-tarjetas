# Tema oscuro del estudio de precios de tarjetas.
#
# Las superficies salen del navy de marca (#20397F) llevado a luminosidades bajas;
# el texto es el gris claro de marca (#E5E6E8) y el acento principal el Sky Blue
# (#009FE3). El amarillo brillante (#FCDA01) se reserva como acento puntual: en los
# gráficos marca la entidad que está bajo el puntero.
#
# Tipografía: Chivo, una grotesca de trazo técnico, en todo el texto; Chivo Mono sólo
# para el código y el número grabado de la tarjeta de la portada.
#
# La escala categórica de los gráficos está validada sobre este fondo: banda de
# luminosidad, piso de croma, separación para daltonismo (ΔE 8.2 en el peor par
# adyacente), piso de visión normal (19.8) y contraste ≥ 3:1. No cambiar un color
# suelto sin volver a validarla: los dos cianes y los dos amarillos del manual de
# marca son indistinguibles entre sí (ΔE 0.6) y no sirven como series contiguas.

[theme]
base = "dark"
primaryColor = "#009FE3"
backgroundColor = "#0A142F"
secondaryBackgroundColor = "#182544"
codeBackgroundColor = "#101B38"
textColor = "#E5E6E8"
codeTextColor = "#B6E5FF"
linkColor = "#1FA9E2"
borderColor = "#2E406D"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "full"

font = "Chivo:https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;800&display=swap"
headingFont = "Chivo:https://fonts.googleapis.com/css2?family=Chivo:wght@700;800;900&display=swap"
codeFont = "'Chivo Mono':https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500;600&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["34px", "26px", "20px", "16px", "14px", "12px"]
headingFontWeights = [900, 800, 700, 700, 600, 600]
metricValueFontSize = "1.85rem"
metricValueFontWeight = 800
linkUnderline = false

# Colores semánticos. El amarillo de marca hace de advertencia, que es donde más
# se nota y donde su brillo trabaja a favor.
greenColor = "#00A749"
redColor = "#E1388D"
yellowColor = "#FCDA01"
orangeColor = "#D26100"
blueColor = "#009FE3"
violetColor = "#A558EB"
grayColor = "#8F9BB8"

dataframeBorderColor = "#2E406D"
dataframeHeaderBackgroundColor = "#1B2BB8"
dataframeHeaderTextColor = "#FFFFFF"

# Escala categórica validada, diez series. Los dos primeros son los tonos de marca:
# el Sky Blue tal cual y el amarillo de marca en un paso más profundo, porque el
# #FCDA01 original (L 0.89) queda fuera de la banda oscura y opacaría al resto.
#
# **El orden es parte de la validación, no es decorativo.** El turquesa de la
# novena posición separa el azul del rojo: con otra secuencia, verde y rojo quedan
# contiguos y su separación cae a ΔE 1.7 bajo deuteranopía (indistinguibles). Si
# reordenas o añades un color, vuelve a pasar el validador.
chartCategoricalColors = [
    "#009FE3",
    "#B29000",
    "#E1388D",
    "#00A749",
    "#A558EB",
    "#D26100",
    "#00A0A2",
    "#4879FF",
    "#00A480",
    "#E24A45",
]

# Rampa secuencial de un solo tono (Sky Blue de marca). En oscuro el extremo
# brillante es el valor alto, para que "más" se lea como "más luminoso".
chartSequentialColors = [
    "#003758",
    "#004974",
    "#005C8F",
    "#006FAA",
    "#0083C9",
    "#0097E1",
    "#00ACF7",
    "#2BC1FF",
    "#81D4FF",
    "#B6E5FF",
]

[theme.sidebar]
backgroundColor = "#1B2BD6"
secondaryBackgroundColor = "#0E1570"
codeBackgroundColor = "#0A142F"
textColor = "#FFFFFF"
borderColor = "#6F8CFF"
primaryColor = "#FFC400"

[server]
# Los rangos amplios pueden devolver muchos registros; el mensaje por websocket
# debe poder cargarlos sin cortarse.
maxMessageSize = 400
